<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Media Queries</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f4f4;
      color: #222;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border: 1px solid #ddd;
    }

    h1 {
      font-size: 2rem;
      color: #c79a2b;
      margin-bottom: 15px;
      text-align: left;
    }

    .hero img {
      width: 100%;
      display: block;
      height: auto;
      border: 1px solid #ccc;
    }

    .content {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      margin: 20px 0;
    }

    .icon-box {
      flex: 0 0 90px;
      height: 110px;
      background: #cfefff;
      border: 3px solid #6a5acd;
      border-radius: 20px;
    }

    .text-box {
      flex: 1;
      font-size: 1rem;
    }

    .map-section {
      margin-top: 20px;
    }

    .map-section iframe {
      width: 100%;
      height: 350px;
      border: 0;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.6rem;
        text-align: center;
      }

      .content {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .icon-box {
        width: 90px;
        height: 110px;
      }

      .text-box {
        font-size: 0.95rem;
      }

      .map-section iframe {
        height: 280px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
      }

      h1 {
        font-size: 1.3rem;
      }

      .text-box {
        font-size: 0.9rem;
      }

      .map-section iframe {
        height: 220px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>CSS Media Queries</h1>

    <section class="hero">
      <img src="images/coast.jpg" alt="Ocean waves hitting rocky coast at sunset" />
    </section>

    <section class="content">
      <div class="icon-box"></div>

      <div class="text-box">
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Dicta ex nihil
          quibusdam ratione quod in laboriosam in recusandae minus nisi sit
          corporis saepe eos, cum debitis. Dignissimos dicta dolore officia.
        </p>
      </div>
    </section>

    <section class="map-section">
      <iframe
        src="https://www.google.com/maps?q=Algonquin+College+Ottawa+Campus&output=embed"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </section>
  </main>
</body>
</html>
